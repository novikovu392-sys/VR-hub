<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VR Hub - Multiplayer Sync</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f1115; font-family: sans-serif; user-select: none; }
  #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #111; color: #fff; text-align: center; padding: 20px; box-sizing: border-box; }

  p { color: #aaa; font-size: 15px; max-width: 400px; line-height: 1.4; margin-bottom: 20px; }
  .btn { padding: 14px 28px; font-size: 18px; font-weight: bold; background: #4aa3df; color: #fff; border: none; border-radius: 10px; cursor: pointer; margin: 8px; }
  .btn:active { background: #357abd; }
  .btn-sec { background: #333; border: 1px solid #555; }
  .btn-danger { background: #c0392b; border: 1px solid #e74c3c; }

  #pc-panel { display: none; width: 100%; height: 100%; background: #181c24; position: absolute; top: 0; left: 0; z-index: 900; padding: 16px; box-sizing: border-box; flex-direction: column; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 12px; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
  .top-bar .left { text-align: left; }
  .top-bar .right { display: flex; gap: 10px; flex-wrap: wrap; }
  .main-content { display: flex; flex: 1; gap: 16px; overflow: hidden; min-height: 0; }
  .sidebar { width: 280px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
  .game-card { background: #222834; border: 1px solid #3a4454; border-radius: 12px; padding: 14px; text-align: left; }
  .game-card h3 { margin: 0 0 10px 0; color: #4aa3df; }
  .game-card p { font-size: 13px; color: #aaa; margin: 0 0 12px 0; }
  #pc-view-container { flex: 1; background: #000; border-radius: 12px; overflow: hidden; position: relative; min-width: 0; }
  #pc-view-container canvas { display: block; width: 100% !important; height: 100% !important; }

  #vr-container { width: 100vw; height: 100vh; display: none; position: relative; z-index: 10; }
  #left-view { position: absolute; top: 0; left: 0; width: 50%; height: 100%; overflow: hidden; }
  #right-view { position: absolute; top: 0; right: 0; width: 50%; height: 100%; overflow: hidden; }
</style>

        <h3>Майнкрафт</h3>

        <button class="btn" onclick="launchGame('minecraft')">Запустить</button>

    <div id="pc-view-container"></div>
  </div>
</div>

  <div id="left-view"></div>
  <div id="right-view"></div>
</div>

<script>

const db = firebase.database();

let sessionCode = null;
let role = null;
let sessionRef = null;

let scene, cameraL, cameraR, rendererL, rendererR;
let pcScene, pcCamera, pcRenderer;
let isPlaying = false;
let pcStreamActive = false;
let pcFsState = false;
let playerPos = new THREE.Vector3(0, 1.7, 10);
let targetQuaternion = new THREE.Quaternion();
let currentQuaternion = new THREE.Quaternion();
let baseQuaternion = null;

const fixedBuildingsData = [
  {x: -120, z: -120, h: 45, color: 0x7d8590},
  {x: -120, z: -60,  h: 60, color: 0x8a93a3},
  {x: -120, z: 60,   h: 35, color: 0x9a8f86},
  {x: -120, z: 120,  h: 70, color: 0x6f7d92},
  {x: -60,  z: -120, h: 50, color: 0x86796f},
  {x: -60,  z: -60,  h: 80, color: 0x9aa0a8},
  {x: -60,  z: 60,   h: 40, color: 0x7d8590},
  {x: -60,  z: 120,  h: 55, color: 0x8a93a3},
  {x: 60,   z: -120, h: 65, color: 0x9a8f86},
  {x: 60,   z: -60,  h: 45, color: 0x6f7d92},
  {x: 60,   z: 60,   h: 75, color: 0x86796f},
  {x: 60,   z: 120,  h: 50, color: 0x9aa0a8},
  {x: 120,  z: -120, h: 40, color: 0x7d8590},
  {x: 120,  z: -60,  h: 55, color: 0x8a93a3},
  {x: 120,  z: 60,   h: 85, color: 0x9a8f86},
  {x: 120,  z: 120,  h: 60, color: 0x6f7d92}
];

function selectRole(r) {
  role = r;
  if (role === 'pc') {
    sessionCode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('pc-code-display').innerText = 'Код: ' + sessionCode;
    document.getElementById('ui-layer').style.display = 'none';
    document.getElementById('pc-panel').style.display = 'flex';

    sessionRef = db.ref('sessions/' + sessionCode);
    sessionRef.set({ status: 'menu', game: null, fs: false, quat: {x:0,y:0,z:0,w:1}, pos: {x:0,y:1.7,z:10} });

    sessionRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      if (data.status === 'playing') {
        pcStreamActive = true;
      } else {
        pcStreamActive = false;
      }

      if (data.quat && data.pos) {
        currentQuaternion.set(data.quat.x, data.quat.y, data.quat.z, data.quat.w);
        playerPos.set(data.pos.x, data.pos.y, data.pos.z);
      }
      updateFsButton(!!data.fs);
    });

    initPCStreamScene();
    animatePC();
    window.addEventListener('resize', onWindowResize);
    setTimeout(onWindowResize, 100);
  } else {
    document.getElementById('step-role').style.display = 'none';
    document.getElementById('step-phone-wait').style.display = 'block';
  }
}

function joinSession() {
  const code = document.getElementById('joinCodeInput').value.trim();
  if (code.length !== 4) {
    document.getElementById('phone-status').innerText = 'Введите 4 цифры!';
    return;
  }
  sessionCode = code;
  sessionRef = db.ref('sessions/' + sessionCode);

  sessionRef.once('value', (snapshot) => {
    if (snapshot.exists()) {
      document.getElementById('phone-status').innerText = 'Подключено! Ожидание запуска...';
      document.getElementById('step-phone-wait').innerHTML = '<h1>Ожидание игры</h1><p>Устройство подключено. Запустите игру на ПК.</p>';

      sessionRef.on('value', (snap) => {
        const val = snap.val();
        if (!val) return;
        if (val.status === 'playing' && !isPlaying) {
          currentActiveGame = val.game || 'city';
          startVRGameEngine();
        } else if (val.status === 'menu' && isPlaying) {
          stopVRGameEngine();
        }

        // Sync position + orientation from PC into the phone view
        if (isPlaying && val.pos) {
          playerPos.set(val.pos.x, val.pos.y, val.pos.z);
        }
        if (isPlaying && val.quat) {
          targetQuaternion.set(val.quat.x, val.quat.y, val.quat.z, val.quat.w);
        }
        // Sync Minecraft blocks so the phone renders them
        if (isPlaying && currentActiveGame === 'minecraft' && val.blocks && scene) {
          syncMinecraftBlocks(val.blocks);
        }
      });
    } else {
      document.getElementById('phone-status').innerText = 'Сессия не найдена!';
    }
  });
}

let currentActiveGame = 'city';
let minecraftBlocks = [];
let raycaster = new THREE.Raycaster();
let blockGeo = new THREE.BoxGeometry(2, 2, 2);
let blockMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
let highlightBox = null;
let playerVelY = 0;
let isGrounded = false;

function initMinecraftEnvironment(sceneTarget) {
  sceneTarget.background = new THREE.Color(0xa0e0ff);
  sceneTarget.fog = new THREE.Fog(0xa0e0ff, 100, 400);

  var sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(50, 200, 50);
  sceneTarget.add(sun);
  sceneTarget.add(new THREE.AmbientLight(0xffffff, 0.6));

  // Platform
  var ground = new THREE.Mesh(
    new THREE.BoxGeometry(200, 2, 200),
    new THREE.MeshStandardMaterial({ color: 0x55aa55 })
  );
  ground.position.set(0, -1, 0);
  sceneTarget.add(ground);

  // Highlight box for targeted building/destroying
  var wireGeo = new THREE.BoxGeometry(2.05, 2.05, 2.05);
  var wireMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
  highlightBox = new THREE.Mesh(wireGeo, wireMat);
  highlightBox.visible = false;
  sceneTarget.add(highlightBox);

  // Clear/init blocks
  minecraftBlocks = [];
}

function syncMinecraftBlocks(blocks) {
  if (!scene) return;
  // Remove all existing non-base, non-highlight meshes
  var toRemove = [];
  scene.children.forEach(function(o) {
    if (o.isMesh && o !== highlightBox && !(o.geometry && o.geometry.parameters && o.geometry.parameters.width === 200)) {
      toRemove.push(o);
    }
  });
  toRemove.forEach(function(o) { scene.remove(o); });

  // Re-add from synced data
  (blocks || []).forEach(function(b) {
    var m = new THREE.Mesh(blockGeo, blockMat);
    m.position.set(b.x, b.y, b.z);
    scene.add(m);
  });
}

function getGamepadControls() {
  var pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (var i = 0; i < pads.length; i++) {
    var gp = pads[i];
    if (gp && gp.connected) {
      var ax = gp.axes[0] || 0;
      var ay = gp.axes[1] || 0;
      if (Math.abs(ax) < 0.15) ax = 0;
      if (Math.abs(ay) < 0.15) ay = 0;
      
      // Buttons:
      // 0: X (cross / bottom button)
      // 6: L2, 7: R2
      var xPressed = gp.buttons[0] ? gp.buttons[0].pressed : false;
      var l2Pressed = gp.buttons[6] ? gp.buttons[6].pressed : (gp.buttons[6] && gp.buttons[6].value > 0.5);
      var r2Pressed = gp.buttons[7] ? gp.buttons[7].pressed : (gp.buttons[7] && gp.buttons[7].value > 0.5);

      return { x: ax, y: ay, jump: xPressed, l2: l2Pressed, r2: r2Pressed };
    }
  }
  return { x: 0, y: 0, jump: false, l2: false, r2: false };
}

function launchGame(gameName) {
  currentActiveGame = gameName;
  if (sessionRef) {
    sessionRef.update({ status: 'playing', game: gameName, blocks: [] });
  }
}

function togglePcFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().then(() => {
      const btn = document.getElementById('pcFsBtn');
      if (btn) btn.innerText = 'Свернуть экран';
    }).catch(()=>{});
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
}

// Keep the button label in sync every time fullscreen toggles (multi-use)
document.addEventListener('fullscreenchange', () => {
  const btn = document.getElementById('pcFsBtn');
  if (btn) {
    btn.innerText = document.fullscreenElement ? 'Свернуть экран' : 'Полный экран';
  }
});

function exitGameFromPC() {
  if (sessionRef) {
    sessionRef.update({ status: 'menu', game: null, fs: false });
  }
}


function getScreenAngle() {
  if (window.screen && screen.orientation && typeof screen.orientation.angle === 'number') {
    return screen.orientation.angle;
  }
  return window.orientation || 0;
}

function handleOrientation(e) {
  if (e.alpha === null || e.beta === null || e.gamma === null) return;
  var alpha = THREE.MathUtils.degToRad(e.alpha);
  var beta = THREE.MathUtils.degToRad(e.beta);
  var gamma = THREE.MathUtils.degToRad(e.gamma);

  var zee = new THREE.Vector3(0, 0, 1);
  var euler = new THREE.Euler();
  var q0 = new THREE.Quaternion();
  var q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  euler.set(beta, alpha, -gamma, 'YXZ');
  var q = new THREE.Quaternion().setFromEuler(euler);
  q.multiply(q1);
  q.multiply(q0.setFromAxisAngle(zee, -getScreenAngle()));

  if (!baseQuaternion) {
    baseQuaternion = q.clone().invert();
  }

  targetQuaternion.copy(baseQuaternion).multiply(q);
  var eu = new THREE.Euler().setFromQuaternion(targetQuaternion, 'YXZ');
  targetQuaternion.setFromEuler(new THREE.Euler(eu.x, eu.y, 0, 'YXZ'));

  if (sessionRef && isPlaying) {
    sessionRef.update({
      quat: { x: targetQuaternion.x, y: targetQuaternion.y, z: targetQuaternion.z, w: targetQuaternion.w }
    });
  }
}

function buildCityEnvironment(sceneTarget) {
  sceneTarget.background = new THREE.Color(0x87ceeb);
  sceneTarget.fog = new THREE.Fog(0x87ceeb, 120, 600);

  var sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(80, 200, 60);
  sceneTarget.add(sun);

  var ambient = new THREE.AmbientLight(0xffffff, 0.7);
  sceneTarget.add(ambient);

  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1200, 1200),
    new THREE.MeshStandardMaterial({ color: 0x9aa3ab })
  );
  ground.rotation.x = -Math.PI / 2;
  sceneTarget.add(ground);

  var roadMat = new THREE.MeshStandardMaterial({ color: 0x555b63 });
  for (var i = -400; i <= 400; i += 120) {
    var roadA = new THREE.Mesh(new THREE.PlaneGeometry(16, 1200), roadMat);
    roadA.rotation.x = -Math.PI / 2;
    roadA.position.set(i, 0.02, 0);
    sceneTarget.add(roadA);

    var roadB = new THREE.Mesh(new THREE.PlaneGeometry(1200, 16), roadMat);
    roadB.rotation.x = -Math.PI / 2;
    roadB.position.set(0, 0.02, i);
    sceneTarget.add(roadB);
  }

  var boxGeo = new THREE.BoxGeometry(1, 1, 1);
  fixedBuildingsData.forEach(b => {
    var mat = new THREE.MeshStandardMaterial({ color: b.color });
    var building = new THREE.Mesh(boxGeo, mat);
    building.scale.set(30, b.h, 30);
    building.position.set(b.x, b.h / 2, b.z);
    sceneTarget.add(building);
  });
}

function initPCStreamScene() {
  const container = document.getElementById('pc-view-container');
  container.innerHTML = '';
  pcScene = new THREE.Scene();
  if (currentActiveGame === 'minecraft') {
    initMinecraftEnvironment(pcScene);
  } else {
    buildCityEnvironment(pcScene);
  }

  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;

  pcCamera = new THREE.PerspectiveCamera(75, w / h, 0.1, 2000);
  pcRenderer = new THREE.WebGLRenderer({ antialias: true });
  pcRenderer.setSize(w, h);
  pcRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(pcRenderer.domElement);
}

let gamepadMoveSpeed = 14;
let lastJump = false;
let lastL2 = false;
let lastR2 = false;

function getGamepadInput() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (let i = 0; i < pads.length; i++) {
    const pad = pads[i];
    if (pad && pad.connected) {
      let sx = pad.axes[0] || 0;
      let sy = pad.axes[1] || 0;
      if (Math.abs(sx) < 0.15) sx = 0;
      if (Math.abs(sy) < 0.15) sy = 0;
      const xButton = pad.buttons[0] ? pad.buttons[0].pressed : false;
      const l2 = pad.buttons[6] ? (pad.buttons[6].pressed || pad.buttons[6].value > 0.5) : false;
      const r2 = pad.buttons[7] ? (pad.buttons[7].pressed || pad.buttons[7].value > 0.5) : false;
      return { sx, sy, xButton, l2, r2 };
    }
  }
  return { sx: 0, sy: 0, xButton: false, l2: false, r2: false };
}

function updateGamepadMovement() {
  if (!pcStreamActive || !sessionRef) return;
  const gp = getGamepadInput();

  // ---- Gravity & jumping (works in both City and Minecraft) ----
  const groundY = 1.7;
  if (playerPos.y <= groundY) {
    playerPos.y = groundY;
    playerVelY = 0;
    isGrounded = true;
  } else {
    playerVelY -= 0.02;
    playerPos.y += playerVelY;
    if (playerPos.y <= groundY) {
      playerPos.y = groundY;
      playerVelY = 0;
      isGrounded = true;
    }
  }
  if (gp.xButton && isGrounded && !lastJump) {
    playerVelY = 0.4;
    isGrounded = false;
  }
  lastJump = gp.xButton;

  // ---- Movement (left stick) ----
  if (Math.abs(gp.sx) > 0.15 || Math.abs(gp.sy) > 0.15) {
    var forward = new THREE.Vector3(0, 0, -1).applyQuaternion(currentQuaternion);
    var right = new THREE.Vector3(1, 0, 0).applyQuaternion(currentQuaternion);
    forward.y = 0; forward.normalize();
    right.y = 0; right.normalize();
    var move = new THREE.Vector3();
    move.addScaledVector(forward, -gp.sy);
    move.addScaledVector(right, gp.sx);
    move.normalize().multiplyScalar(gamepadMoveSpeed * 0.016);
    playerPos.add(move);
    if (playerPos.y < groundY) playerPos.y = groundY;
  }

  // ---- Minecraft: place (R2) / destroy (L2) ----
  if (currentActiveGame === 'minecraft' && pcScene) {
    raycaster.setFromCamera(new THREE.Vector2(0, 0), pcCamera);
    var objectsToCheck = pcScene.children.filter(function(o) { return o.isMesh && o !== highlightBox; });
    var intersects = raycaster.intersectObjects(objectsToCheck);

    if (intersects.length > 0) {
      var hit = intersects[0];
      if (hit.distance < 20) {
        highlightBox.position.copy(hit.object.position);
        highlightBox.visible = true;

        // R2 -> place block on the face that was hit
        if (gp.r2 && !lastR2) {
          var normal = hit.face.normal.clone();
          normal.transformDirection(hit.object.matrixWorld);
          var newPos = hit.object.position.clone().add(normal.clone().multiplyScalar(2));
          var newBlock = new THREE.Mesh(blockGeo, blockMat);
          newBlock.position.copy(newPos);
          pcScene.add(newBlock);
          minecraftBlocks.push({ x: newPos.x, y: newPos.y, z: newPos.z });
          sessionRef.update({ blocks: minecraftBlocks });
        }

        // L2 -> destroy the block (but not the base platform)
        if (gp.l2 && !lastL2) {
          var isBase = hit.object.geometry && hit.object.geometry.parameters && hit.object.geometry.parameters.width === 200;
          if (!isBase) {
            pcScene.remove(hit.object);
            minecraftBlocks = minecraftBlocks.filter(function(b) {
              return Math.abs(b.x - hit.object.position.x) > 0.1 ||
                     Math.abs(b.y - hit.object.position.y) > 0.1 ||
                     Math.abs(b.z - hit.object.position.z) > 0.1;
            });
            sessionRef.update({ blocks: minecraftBlocks });
            highlightBox.visible = false;
          }
        }
      } else {
        highlightBox.visible = false;
      }
    } else {
      highlightBox.visible = false;
    }
  }

  lastL2 = gp.l2;
  lastR2 = gp.r2;

  sessionRef.update({ pos: { x: playerPos.x, y: playerPos.y, z: playerPos.z } });
}

function animatePC() {
  if (role !== 'pc') return;
  requestAnimationFrame(animatePC);

  if (!pcRenderer || !pcCamera) return;

  updateGamepadMovement();

  if (pcStreamActive) {
    currentQuaternion.slerp(targetQuaternion, 0.25);
    pcCamera.position.copy(playerPos);
    pcCamera.quaternion.copy(currentQuaternion);
  } else {
    var t = Date.now() * 0.0001;
    pcCamera.position.set(Math.cos(t) * 180, 130, Math.sin(t) * 180);
    pcCamera.lookAt(0, 30, 0);
  }

  pcRenderer.render(pcScene, pcCamera);
}

function startVRGameEngine() {
  document.getElementById('ui-layer').style.display = 'none';
  document.getElementById('vr-container').style.display = 'block';
  isPlaying = true;

  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(resp => {
      if (resp === 'granted') window.addEventListener('deviceorientation', handleOrientation, true);
  window.addEventListener('gamepadconnected', (e) => { console.log('Gamepad connected:', e.gamepad.id); });
  window.addEventListener('gamepaddisconnected', (e) => { console.log('Gamepad disconnected:', e.gamepad.id); });
    }).catch(console.error);
  } else {
    window.addEventListener('deviceorientation', handleOrientation, true);
  }

  initVR3D();
  animateVR();
}

function stopVRGameEngine() {
  isPlaying = false;
  document.getElementById('vr-container').style.display = 'none';
  document.getElementById('ui-layer').style.display = 'flex';
  document.getElementById('step-role').style.display = 'none';
  document.getElementById('step-phone-wait').style.display = 'block';
  document.getElementById('step-phone-wait').innerHTML = '<h1>Ожидание игры</h1><p>Игра завершена на ПК. Выберите другую игру.</p>';
}

function initVR3D() {
  scene = new THREE.Scene();
  if (currentActiveGame === 'minecraft') {
    initMinecraftEnvironment(scene);
  } else {
    buildCityEnvironment(scene);
  }

  var leftView = document.getElementById('left-view');
  var rightView = document.getElementById('right-view');
  leftView.innerHTML = '';
  rightView.innerHTML = '';

  var aspect = (window.innerWidth / 2) / window.innerHeight;
  cameraL = new THREE.PerspectiveCamera(75, aspect, 0.1, 2000);
  cameraR = new THREE.PerspectiveCamera(75, aspect, 0.1, 2000);

  rendererL = new THREE.WebGLRenderer({ antialias: true });
  rendererL.setSize(leftView.clientWidth, leftView.clientHeight);
  rendererL.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  leftView.appendChild(rendererL.domElement);

  rendererR = new THREE.WebGLRenderer({ antialias: true });
  rendererR.setSize(rightView.clientWidth, rightView.clientHeight);
  rendererR.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  rightView.appendChild(rendererR.domElement);

  window.addEventListener('resize', onWindowResize);
}

function onWindowResize() {
  if (role === 'phone') {
    if (!isPlaying) return;
    var leftView = document.getElementById('left-view');
    var rightView = document.getElementById('right-view');
    var w = leftView.clientWidth;
    var h = leftView.clientHeight;
    rendererL.setSize(w, h);
    rendererR.setSize(w, h);
    cameraL.aspect = w / h;
    cameraL.updateProjectionMatrix();
    cameraR.aspect = w / h;
    cameraR.updateProjectionMatrix();
  } else if (role === 'pc') {
    const container = document.getElementById('pc-view-container');
    if (container && pcRenderer && pcCamera) {
      pcRenderer.setSize(container.clientWidth, container.clientHeight);
      pcCamera.aspect = container.clientWidth / container.clientHeight;
      pcCamera.updateProjectionMatrix();
    }
  }
}

function getGamepadMove() {
  var pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (var i = 0; i < pads.length; i++) {
    var gp = pads[i];
    if (gp && gp.connected) {
      var ax = gp.axes[0] || 0;
      var ay = gp.axes[1] || 0;
      if (Math.abs(ax) < 0.15) ax = 0;
      if (Math.abs(ay) < 0.15) ay = 0;
      return { x: ax, y: ay };
    }
  }
  return { x: 0, y: 0 };
}

function animateVR() {
  if (!isPlaying || role !== 'phone') return;
  requestAnimationFrame(animateVR);

  currentQuaternion.slerp(targetQuaternion, 0.25);

  // Phone also supports a connected gamepad: left stick moves the player
  var joy = getGamepadMove();
  if (joy.x !== 0 || joy.y !== 0) {
    var forward = new THREE.Vector3(0, 0, -1).applyQuaternion(currentQuaternion);
    var right = new THREE.Vector3(1, 0, 0).applyQuaternion(currentQuaternion);
    forward.y = 0; forward.normalize();
    right.y = 0; right.normalize();
    var move = new THREE.Vector3();
    move.addScaledVector(forward, -joy.y);
    move.addScaledVector(right, joy.x);
    move.normalize().multiplyScalar(14 * 0.016);
    playerPos.add(move);
    if (sessionRef && isPlaying) {
      sessionRef.update({ pos: { x: playerPos.x, y: playerPos.y, z: playerPos.z } });
    }
  }

  var ipd = 0.032;
  var offL = new THREE.Vector3(-ipd, 0, 0).applyQuaternion(currentQuaternion);
  var offR = new THREE.Vector3(ipd, 0, 0).applyQuaternion(currentQuaternion);

  cameraL.position.copy(playerPos).add(offL);
  cameraL.quaternion.copy(currentQuaternion);

  cameraR.position.copy(playerPos).add(offR);
  cameraR.quaternion.copy(currentQuaternion);

  rendererL.render(scene, cameraL);
  rendererR.render(scene, cameraR);
}
</script>
