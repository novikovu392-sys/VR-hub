<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR Hub - City</title>
<style>
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }
  #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: #fff; text-align: center; padding: 20px; }
  #menu h1 { font-size: 32px; margin-bottom: 10px; color: #4aa3df; }
  #menu p { color: #aaa; max-width: 400px; margin-bottom: 30px; font-size: 16px; line-height: 1.4; }
  .btn { padding: 16px 32px; font-size: 20px; background: #4aa3df; color: #fff; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(74, 163, 223, 0.4); }
  .btn:active { background: #357abd; transform: scale(0.98); }
  #fullscreenBtn { position: absolute; top: 20px; right: 20px; z-index: 2000; padding: 10px 18px; font-size: 14px; background: rgba(50,50,50,0.8); color: #fff; border: 1px solid #777; border-radius: 8px; cursor: pointer; }
  #vr-container { width: 100vw; height: 100vh; display: none; position: relative; z-index: 10; }
  #left-view { position: absolute; top: 0; left: 0; width: 50%; height: 100%; overflow: hidden; border-right: 2px solid #000; }
  #right-view { position: absolute; top: 0; right: 0; width: 50%; height: 100%; overflow: hidden; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<button id="fullscreenBtn" onclick="toggleFullscreen()">На весь экран</button>

<div id="menu">
  <h1>VR Hub: Город</h1>
  <p>Положите телефон в Cardboard вертикально. Нажмите кнопку и держите ровно перед собой.</p>
  <button class="btn" onclick="startGame()">Начать VR игру</button>
</div>

<div id="vr-container">
  <div id="left-view"></div>
  <div id="right-view"></div>
</div>

<script>
let scene, cameraL, cameraR, rendererL, rendererR;
let isPlaying = false;
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let playerPos = new THREE.Vector3(0, 1.7, 10);

let targetQuaternion = new THREE.Quaternion();
let currentQuaternion = new THREE.Quaternion();
let baseEuler = null;

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {});
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
}

function startGame() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(response => {
      if (response === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }).catch(console.error);
  } else {
    window.addEventListener('deviceorientation', handleOrientation, true);
  }

  document.getElementById('menu').style.display = 'none';
  document.getElementById('vr-container').style.display = 'block';
  isPlaying = true;
  init3D();
}

function handleOrientation(e) {
  if (e.alpha === null || e.beta === null || e.gamma === null) return;

  // Convert device orientation to radians
  const alpha = THREE.MathUtils.degToRad(e.alpha);
  const beta = THREE.MathUtils.degToRad(e.beta);
  const gamma = THREE.MathUtils.degToRad(e.gamma);

  const zee = new THREE.Vector3(0, 0, 1);
  const euler = new THREE.Euler();
  const q0 = new THREE.Quaternion();
  const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  // YXZ order works best for mobile VR head tracking in landscape
  euler.set(beta, alpha, -gamma, 'YXZ');
  let q = new THREE.Quaternion().setFromEuler(euler);
  q.multiply(q1);
  q.multiply(q0.setFromAxisAngle(zee, -window.orientation || 0));

  if (!baseEuler) {
    baseEuler = q.clone().invert();
  }

  targetQuaternion.copy(baseEuler).multiply(q);
}

function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

  const aspect = (window.innerWidth / 2) / window.innerHeight;
  cameraL = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
  cameraR = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);

  rendererL = new THREE.WebGLRenderer({ antialias: true });
  rendererL.setSize(window.innerWidth / 2, window.innerHeight);
  rendererL.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('left-view').appendChild(rendererL.domElement);

  rendererR = new THREE.WebGLRenderer({ antialias: true });
  rendererR.setSize(window.innerWidth / 2, window.innerHeight);
  rendererR.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('right-view').appendChild(rendererR.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(100, 300, 100);
  scene.add(dirLight);

  // Ground & Roads
  const floorGeo = new THREE.PlaneGeometry(800, 800);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  const roadMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  for (let i = -300; i <= 300; i += 60) {
    const roadX = new THREE.Mesh(new THREE.PlaneGeometry(16, 800), roadMat);
    roadX.rotation.x = -Math.PI / 2;
    roadX.position.set(i, 0.02, 0);
    scene.add(roadX);

    const roadZ = new THREE.Mesh(new THREE.PlaneGeometry(800, 16), roadMat);
    roadZ.rotation.x = -Math.PI / 2;
    roadZ.position.set(0, 0.02, i);
    scene.add(roadZ);
  }

  // Spacious City Buildings
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  const colors = [0x555566, 0x666677, 0x776666, 0x445566, 0x665555];

  for (let x = -280; x <= 280; x += 60) {
    for (let z = -280; z <= 280; z += 60) {
      if (Math.abs(x) < 30 && Math.abs(z) < 30) continue; // Center spawn clear

      const offsets = [-16, 16];
      for (let ox of offsets) {
        for (let oz of offsets) {
          const bx = x + ox;
          const bz = z + oz;
          const h = Math.random() * 60 + 20;
          const mat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });
          const building = new THREE.Mesh(boxGeo, mat);
          building.scale.set(22, h, 22);
          building.position.set(bx, h / 2, bz);
          scene.add(building);
        }
      }
    }
  }

  window.addEventListener('resize', onWindowResize);
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);

  animate();
}

function onWindowResize() {
  if (!isPlaying) return;
  const w = window.innerWidth / 2;
  const h = window.innerHeight;
  rendererL.setSize(w, h);
  rendererR.setSize(w, h);
  cameraL.aspect = w / h;
  cameraL.updateProjectionMatrix();
  cameraR.aspect = w / h;
  cameraR.updateProjectionMatrix();
}

function onKeyDown(e) {
  if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
}

function onKeyUp(e) {
  if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
}

function updateMovement() {
  let speed = 0.25;
  let forwardDir = new THREE.Vector3(0, 0, -1).applyQuaternion(currentQuaternion);
  forwardDir.y = 0;
  forwardDir.normalize();
  let rightDir = new THREE.Vector3(1, 0, 0).applyQuaternion(currentQuaternion);
  rightDir.y = 0;
  rightDir.normalize();

  let moveVec = new THREE.Vector3();
  if (moveForward) moveVec.add(forwardDir);
  if (moveBackward) moveVec.sub(forwardDir);
  if (moveLeft) moveVec.sub(rightDir);
  if (moveRight) moveVec.add(rightDir);
  moveVec.normalize();

  playerPos.addScaledVector(moveVec, speed);
  playerPos.x = Math.max(-350, Math.min(350, playerPos.x));
  playerPos.z = Math.max(-350, Math.min(350, playerPos.z));
}

function pollGamepad() {
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (let i = 0; i < gamepads.length; i++) {
    const gp = gamepads[i];
    if (gp) {
      let ax = gp.axes[0];
      let ay = gp.axes[1];
      if (Math.abs(ax) > 0.1 || Math.abs(ay) > 0.1) {
        let forwardDir = new THREE.Vector3(0, 0, -1).applyQuaternion(currentQuaternion);
        forwardDir.y = 0; forwardDir.normalize();
        let rightDir = new THREE.Vector3(1, 0, 0).applyQuaternion(currentQuaternion);
        rightDir.y = 0; rightDir.normalize();

        let moveVec = new THREE.Vector3();
        moveVec.addScaledVector(forwardDir, -ay);
        moveVec.addScaledVector(rightDir, ax);
        playerPos.addScaledVector(moveVec, 0.25);
      }
    }
  }
}

function animate() {
  if (!isPlaying) return;
  requestAnimationFrame(animate);

  updateMovement();
  pollGamepad();

  currentQuaternion.slerp(targetQuaternion, 0.2);

  let ipd = 0.032;
  let eyeOffsetL = new THREE.Vector3(-ipd, 0, 0).applyQuaternion(currentQuaternion);
  let eyeOffsetR = new THREE.Vector3(ipd, 0, 0).applyQuaternion(currentQuaternion);

  cameraL.position.copy(playerPos).add(eyeOffsetL);
  cameraL.quaternion.copy(currentQuaternion);

  cameraR.position.copy(playerPos).add(eyeOffsetR);
  cameraR.quaternion.copy(currentQuaternion);

  rendererL.render(scene, cameraL);
  rendererR.render(scene, cameraR);
}
</script>
</body>
</html>
