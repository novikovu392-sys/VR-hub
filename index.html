<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VR Hub - City</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
  #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: #fff; text-align: center; padding: 20px; pointer-events: auto; }
  #menu h1 { font-size: 30px; margin-bottom: 10px; color: #4aa3df; }
  #menu p { color: #aaa; max-width: 380px; margin-bottom: 30px; font-size: 15px; line-height: 1.45; }
  .btn { padding: 16px 34px; font-size: 20px; color: #fff; background: #4aa3df; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; display: inline-block; }
  .btn:active { background: #357abd; }
  #fullscreenBtn { position: absolute; top: 16px; right: 16px; z-index: 2000; padding: 10px 18px; font-size: 14px; color: #fff; background: rgba(40,40,40,0.85); border: 1px solid #666; border-radius: 8px; cursor: pointer; }
  #vr-container { width: 100vw; height: 100vh; display: none; position: relative; z-index: 10; }
  #left-view { position: absolute; top: 0; left: 0; width: 50%; height: 100%; overflow: hidden; }
  #right-view { position: absolute; top: 0; right: 0; width: 50%; height: 100%; overflow: hidden; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<button id="fullscreenBtn" onclick="toggleFullscreen()">На весь экран</button>

<div id="menu">
  <h1>VR Hub: Город</h1>
  <p>Вставьте телефон в Cardboard, нажмите кнопку и смотрите прямо.</p>
  <button class="btn" onclick="startGame()">Начать VR игру</button>
</div>

<div id="vr-container">
  <div id="left-view"></div>
  <div id="right-view"></div>
</div>

<script>
let scene, cameraL, cameraR, rendererL, rendererR;
let isPlaying = false;
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let playerPos = new THREE.Vector3(0, 1.7, 10);

let targetQuaternion = new THREE.Quaternion();
let currentQuaternion = new THREE.Quaternion();
let baseQuaternion = null;

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(function(){});
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
}

function startGame() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(function(response) {
      if (response === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }).catch(console.error);
  } else {
    window.addEventListener('deviceorientation', handleOrientation, true);
  }

  document.getElementById('menu').style.display = 'none';
  document.getElementById('vr-container').style.display = 'block';
  isPlaying = true;
  init3D();
}

function getScreenAngle() {
  if (window.screen && screen.orientation && typeof screen.orientation.angle === 'number') {
    return screen.orientation.angle;
  }
  return window.orientation || 0;
}

// Canonical Cardboard/three.js device-orientation -> world quaternion
function deviceQuaternion(alphaDeg, betaDeg, gammaDeg) {
  var alpha = THREE.MathUtils.degToRad(alphaDeg);
  var beta = THREE.MathUtils.degToRad(betaDeg);
  var gamma = THREE.MathUtils.degToRad(gammaDeg);

  var zee = new THREE.Vector3(0, 0, 1);
  var euler = new THREE.Euler();
  var q0 = new THREE.Quaternion();
  var q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -90 deg around X

  euler.set(beta, alpha, -gamma, 'YXZ');
  var q = new THREE.Quaternion().setFromEuler(euler);
  q.multiply(q1);
  q.multiply(q0.setFromAxisAngle(zee, -getScreenAngle()));

  return q;
}

function handleOrientation(e) {
  if (e.alpha === null || e.beta === null || e.gamma === null) return;

  var q = deviceQuaternion(e.alpha, e.beta, e.gamma);

  if (!baseQuaternion) {
    baseQuaternion = q.clone().invert();
  }

  targetQuaternion.copy(baseQuaternion).multiply(q);
}

function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 120, 600);

  var aspect = (window.innerWidth / 2) / window.innerHeight;
  cameraL = new THREE.PerspectiveCamera(75, aspect, 0.1, 2000);
  cameraR = new THREE.PerspectiveCamera(75, aspect, 0.1, 2000);

  rendererL = new THREE.WebGLRenderer({ antialias: true });
  rendererL.setSize(window.innerWidth / 2, window.innerHeight);
  rendererL.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('left-view').appendChild(rendererL.domElement);

  rendererR = new THREE.WebGLRenderer({ antialias: true });
  rendererR.setSize(window.innerWidth / 2, window.innerHeight);
  rendererR.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('right-view').appendChild(rendererR.domElement);

  var sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(80, 200, 60);
  scene.add(sun);

  var ambient = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambient);

  // Light ground so "looking down" never goes black
  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1200, 1200),
    new THREE.MeshStandardMaterial({ color: 0x9aa3ab })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Roads grid
  var roadMat = new THREE.MeshStandardMaterial({ color: 0x555b63 });
  for (var i = -400; i <= 400; i += 80) {
    var roadA = new THREE.Mesh(new THREE.PlaneGeometry(14, 1200), roadMat);
    roadA.rotation.x = -Math.PI / 2;
    roadA.position.set(i, 0.02, 0);
    scene.add(roadA);

    var roadB = new THREE.Mesh(new THREE.PlaneGeometry(1200, 14), roadMat);
    roadB.rotation.x = -Math.PI / 2;
    roadB.position.set(0, 0.02, i);
    scene.add(roadB);
  }

  // Buildings — dense, tall, colorful so every direction shows content
  var boxGeo = new THREE.BoxGeometry(1, 1, 1);
  var colors = [0x7d8590, 0x8a93a3, 0x9a8f86, 0x6f7d92, 0x86796f, 0x9aa0a8];

  for (var x = -380; x <= 380; x += 80) {
    for (var z = -380; z <= 380; z += 80) {
      if (Math.abs(x) < 40 && Math.abs(z) < 40) continue; // spawn area clear

      var spots = [[x-20,z-20],[x-20,z+20],[x+20,z-20],[x+20,z+20]];
      for (var s = 0; s < spots.length; s++) {
        var bx = spots[s][0];
        var bz = spots[s][1];
        var h = Math.random() * 70 + 25;
        var mat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });
        var building = new THREE.Mesh(boxGeo, mat);
        building.scale.set(24, h, 24);
        building.position.set(bx, h / 2, bz);
        scene.add(building);
      }
    }
  }

  window.addEventListener('resize', onWindowResize);
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);

  animate();
}

function onWindowResize() {
  if (!isPlaying) return;
  var w = window.innerWidth / 2;
  var h = window.innerHeight;
  rendererL.setSize(w, h);
  rendererR.setSize(w, h);
  cameraL.aspect = w / h;
  cameraL.updateProjectionMatrix();
  cameraR.aspect = w / h;
  cameraR.updateProjectionMatrix();
}

function onKeyDown(e) {
  if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
}

function onKeyUp(e) {
  if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
}

function updateMovement() {
  var speed = 0.25;
  var forward = new THREE.Vector3(0, 0, -1).applyQuaternion(currentQuaternion);
  forward.y = 0; forward.normalize();
  var right = new THREE.Vector3(1, 0, 0).applyQuaternion(currentQuaternion);
  right.y = 0; right.normalize();

  var mv = new THREE.Vector3();
  if (moveForward) mv.add(forward);
  if (moveBackward) mv.sub(forward);
  if (moveLeft) mv.sub(right);
  if (moveRight) mv.add(right);
  if (mv.lengthSq() > 0) mv.normalize();

  playerPos.addScaledVector(mv, speed);
  playerPos.x = Math.max(-440, Math.min(440, playerPos.x));
  playerPos.z = Math.max(-440, Math.min(440, playerPos.z));
}

function pollGamepad() {
  var gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (var i = 0; i < gamepads.length; i++) {
    var gp = gamepads[i];
    if (gp) {
      var ax = gp.axes[0];
      var ay = gp.axes[1];
      if (Math.abs(ax) > 0.1 || Math.abs(ay) > 0.1) {
        var forward = new THREE.Vector3(0, 0, -1).applyQuaternion(currentQuaternion);
        forward.y = 0; forward.normalize();
        var right = new THREE.Vector3(1, 0, 0).applyQuaternion(currentQuaternion);
        right.y = 0; right.normalize();
        playerPos.addScaledVector(forward, -ay * 0.25);
        playerPos.addScaledVector(right, ax * 0.25);
      }
    }
  }
}

function animate() {
  if (!isPlaying) return;
  requestAnimationFrame(animate);

  updateMovement();
  pollGamepad();

  currentQuaternion.slerp(targetQuaternion, 0.25);

  var ipd = 0.032;
  var offL = new THREE.Vector3(-ipd, 0, 0).applyQuaternion(currentQuaternion);
  var offR = new THREE.Vector3(ipd, 0, 0).applyQuaternion(currentQuaternion);

  cameraL.position.copy(playerPos).add(offL);
  cameraL.quaternion.copy(currentQuaternion);

  cameraR.position.copy(playerPos).add(offR);
  cameraR.quaternion.copy(currentQuaternion);

  rendererL.render(scene, cameraL);
  rendererR.render(scene, cameraR);
}
</script>
</body>
</html>
