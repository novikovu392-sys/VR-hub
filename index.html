function posSameAsWritten(x, y, z, eps) {
  if (eps === undefined) eps = 0.05;
  return Math.abs(lastWrittenPos.x - x) < eps &&
         Math.abs(lastWrittenPos.y - y) < eps &&
         Math.abs(lastWrittenPos.z - z) < eps;
}

function selectRole(r) {
  role = r;
  if (role === 'pc') {
    sessionCode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('pc-code-display').innerText = 'Код: ' + sessionCode;
    document.getElementById('ui-layer').style.display = 'none';
    document.getElementById('pc-panel').style.display = 'flex';

    sessionRef = db.ref('sessions/' + sessionCode);
    sessionRef.set({ status: 'menu', game: null, quat: {x:0,y:0,z:0,w:1}, pos: {x:0,y:1.7,z:10} });

    sessionRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      if (data.status === 'playing') {
        pcStreamActive = true;
      } else {
        pcStreamActive = false;
      }

      // Sync head rotation from the phone (skip position echo to avoid teleport-back)
      if (data.quat) {
        currentQuaternion.set(data.quat.x, data.quat.y, data.quat.z, data.quat.w);
      }
      if (data.pos && !posSameAsWritten(data.pos.x, data.pos.y, data.pos.z)) {
        playerPos.set(data.pos.x, data.pos.y, data.pos.z);
      }
    });

    initPCStreamScene();
    animatePC();
    window.addEventListener('resize', onWindowResize);
    setTimeout(onWindowResize, 100);
  } else {
    document.getElementById('step-role').style.display = 'none';
    document.getElementById('step-phone-wait').style.display = 'block';
  }
}

function joinSession() {
  const code = document.getElementById('joinCodeInput').value.trim();
  if (code.length !== 4) {
    document.getElementById('phone-status').innerText = 'Введите 4 цифры!';
    return;
  }
  sessionCode = code;
  sessionRef = db.ref('sessions/' + sessionCode);

  sessionRef.once('value', (snapshot) => {
    if (snapshot.exists()) {
      document.getElementById('phone-status').innerText = 'Подключено! Ожидание запуска...';
      document.getElementById('step-phone-wait').innerHTML = '<h1>Ожидание игры</h1><p>Устройство подключено. Запустите игру на ПК.</p>';

      sessionRef.on('value', (snap) => {
        const val = snap.val();
        if (!val) return;
        if (val.status === 'playing' && !isPlaying) {
          startVRGameEngine();
        } else if (val.status === 'playing' && isPlaying && val.game && val.game !== currentActiveGame) {
          // New game launched on PC -> rebuild the phone scene
          currentActiveGame = val.game;
          initVR3D();
        } else if (val.status === 'menu' && isPlaying) {
          stopVRGameEngine();
        }

        // Sync position + orientation from PC (skip our own echo)
        if (isPlaying && val.pos && !posSameAsWritten(val.pos.x, val.pos.y, val.pos.z)) {
          playerPos.set(val.pos.x, val.pos.y, val.pos.z);
        }
        if (isPlaying && val.quat) {
          targetQuaternion.set(val.quat.x, val.quat.y, val.quat.z, val.quat.w);
        }
      });
    } else {
      document.getElementById('phone-status').innerText = 'Сессия не найдена!';
    }
  });
}

function launchGame(gameName) {
  currentActiveGame = gameName;
  trialCurrentIndex = 0;
  trialCompleted = false;
  playerPos.set(0, 1.7, 10);
  playerVelY = 0;
  isGrounded = true;
  if (role === 'pc') {
    initPCStreamScene();
    // Write the REAL spawn (maze start) to the DB atomically so the phone
    // never reads the stale (0,1.7,10) and teleports inside a wall.
    sessionRef.update({ status: 'playing', game: gameName, pos: { x: playerPos.x, y: playerPos.y, z: playerPos.z } });
  } else if (sessionRef) {
    sessionRef.update({ status: 'playing', game: gameName });
  }
}

function exitGameFromPC() {
  if (sessionRef) {
    sessionRef.update({ status: 'menu', game: null });
  }
}


function getScreenAngle() {
  if (window.screen && screen.orientation && typeof screen.orientation.angle === 'number') {
    return screen.orientation.angle;
  }
  return window.orientation || 0;
}

function handleOrientation(e) {
  if (e.alpha === null || e.beta === null || e.gamma === null) return;
  var alpha = THREE.MathUtils.degToRad(e.alpha);
  var beta = THREE.MathUtils.degToRad(e.beta);
  var gamma = THREE.MathUtils.degToRad(e.gamma);

  var zee = new THREE.Vector3(0, 0, 1);
  var euler = new THREE.Euler();
  var q0 = new THREE.Quaternion();
  var q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  euler.set(beta, alpha, -gamma, 'YXZ');
  var q = new THREE.Quaternion().setFromEuler(euler);
  q.multiply(q1);
  q.multiply(q0.setFromAxisAngle(zee, -getScreenAngle()));

  if (!baseQuaternion) {
    baseQuaternion = q.clone().invert();
  }

  targetQuaternion.copy(baseQuaternion).multiply(q);
  var eu = new THREE.Euler().setFromQuaternion(targetQuaternion, 'YXZ');
  targetQuaternion.setFromEuler(new THREE.Euler(eu.x, eu.y, 0, 'YXZ'));

  if (sessionRef && isPlaying) {
    sessionRef.update({
      quat: { x: targetQuaternion.x, y: targetQuaternion.y, z: targetQuaternion.z, w: targetQuaternion.w }
    });
  }
}

function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function generateMaze(rows, cols) {
  var rnd = mulberry32(20261002);
  var cells = [];
  for (var r = 0; r < rows; r++) {
    cells[r] = [];
    for (var c = 0; c < cols; c++) {
      cells[r][c] = { vis: false, walls: { top:true, bottom:true, left:true, right:true } };
    }
  }
  var dirs = [[0,-1,'top','bottom'],[0,1,'bottom','top'],[-1,0,'left','right'],[1,0,'right','left']];
  var stack = [[0,0]];
  cells[0][0].vis = true;
  while (stack.length) {
    var cur = stack[stack.length - 1];
    var r = cur[0], c = cur[1];
    var opts = [];
    for (var i = 0; i < dirs.length; i++) {
      var dr = dirs[i][0], dc = dirs[i][1];
      var nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !cells[nr][nc].vis) opts.push(dirs[i]);
    }
    if (!opts.length) { stack.pop(); continue; }
    var pick = opts[Math.floor(rnd() * opts.length)];
    var nr = r + pick[0], nc = c + pick[1];
    cells[r][c].walls[pick[2]] = false;
    cells[nr][nc].walls[pick[3]] = false;
    cells[nr][nc].vis = true;
    stack.push([nr, nc]);
  }
  // Carve an entrance at the bottom edge of the start cell (0,0)
  cells[0][0].walls.bottom = false;
  // Carve an exit at the top edge of the goal cell (rows-1, cols-1)
  cells[rows-1][cols-1].walls.top = false;
  return cells;
}

function addMazeWall(sceneTarget, geo, mat, x, z, hx, hz) {
  var wall = new THREE.Mesh(geo, mat);
  wall.position.set(x, 3, z);
  wall.userData.half = { hx: hx / 2, hz: hz / 2 };
  sceneTarget.add(wall);
  mazeWalls.push(wall);
}

function canMoveTo(x, z) {
  var R = 0.8;
  for (var i = 0; i < mazeWalls.length; i++) {
    var w = mazeWalls[i];
    var h = w.userData.half;
    if (Math.abs(x - w.position.x) < h.hx + R && Math.abs(z - w.position.z) < h.hz + R) return false;
  }
  return true;
}

function initTrialsEnvironment(sceneTarget) {
  sceneTarget.background = new THREE.Color(0x2c3e50);
  sceneTarget.fog = new THREE.Fog(0x2c3e50, 60, 220);
  sceneTarget.add(new THREE.AmbientLight(0xffffff, 0.65));
  var sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(80, 120, 60);
  sceneTarget.add(sun);

  var ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x5a6b52 }));
  ground.rotation.x = -Math.PI / 2;
  sceneTarget.add(ground);

  // Larger, denser maze so it reads as a real labyrinth
  var ROWS = 13, COLS = 13, CELL = 5, WALL_H = 7;
  var maze = generateMaze(ROWS, COLS);
  var wallMat = new THREE.MeshStandardMaterial({ color: 0x8a6a4a });
  var horGeo = new THREE.BoxGeometry(CELL + 0.8, WALL_H, 0.8);
  var verGeo = new THREE.BoxGeometry(0.8, WALL_H, CELL + 0.8);
  mazeWalls = [];
  var offX = -((COLS - 1) * CELL) / 2;
  var offZ = -((ROWS - 1) * CELL) / 2;

  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var cx = offX + c * CELL;
      var cz = offZ + r * CELL;
      var cell = maze[r][c];
      if (cell.walls.top) addMazeWall(sceneTarget, horGeo, wallMat, cx, cz - CELL / 2, CELL + 0.8, 0.8);
      if (cell.walls.bottom) addMazeWall(sceneTarget, horGeo, wallMat, cx, cz + CELL / 2, CELL + 0.8, 0.8);
      if (cell.walls.left) addMazeWall(sceneTarget, verGeo, wallMat, cx - CELL / 2, cz, 0.8, CELL + 0.8);
      if (cell.walls.right) addMazeWall(sceneTarget, verGeo, wallMat, cx + CELL / 2, cz, 0.8, CELL + 0.8);
    }
  }

  var gx = offX + (COLS - 1) * CELL;
  var gz = offZ + (ROWS - 1) * CELL;
  var goal = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 7, 16), new THREE.MeshStandardMaterial({ color: 0xf1c40f, emissive: 0x8a6d00, emissiveIntensity: 0.6 }));
  goal.position.set(gx, 3.5, gz);
  sceneTarget.add(goal);

  trialCheckpoints = [];
  var ringMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, side: THREE.DoubleSide });
  var ringGeo = new THREE.RingGeometry(2.0, 2.5, 24);
  for (var rr = 0; rr < ROWS; rr++) {
    for (var cc = 0; cc < COLS; cc++) {
      if ((rr * COLS + cc) % 12 === 0 && (rr !== 0 || cc !== 0) && !(rr === ROWS - 1 && cc === COLS - 1)) {
        var chx = offX + cc * CELL;
        var chz = offZ + rr * CELL;
        var ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(chx, 2.4, chz);
        sceneTarget.add(ring);
        trialCheckpoints.push(new THREE.Vector3(chx, 1.7, chz));
      }
    }
  }

  // Spawn just inside the entrance (cell 0,0), facing into the maze
  playerPos.set(offX, 1.7, offZ + CELL / 2);
  playerVelY = 0;
  isGrounded = true;
  trialCurrentIndex = 0;
  trialCompleted = false;
  trialGoalPos.set(gx, 1.7, gz);
}

function checkTrialsProgress() {
  if (currentActiveGame !== 'trials') return;
  if (trialCheckpoints.length && trialCurrentIndex < trialCheckpoints.length) {
    var cd = trialCheckpoints[trialCurrentIndex];
    var cdx = playerPos.x - cd.x;
    var cdz = playerPos.z - cd.z;
    if (cdx * cdx + cdz * cdz < 12) {
      trialCurrentIndex++;
    }
  }
  if (!trialCompleted) {
    var gx = trialGoalPos.x - playerPos.x;
    var gz = trialGoalPos.z - playerPos.z;
    if (gx * gx + gz * gz < 9) {
      trialCompleted = true;
    }
  }
}

function buildCityEnvironment(sceneTarget) {
  sceneTarget.background = new THREE.Color(0x87ceeb);
  sceneTarget.fog = new THREE.Fog(0x87ceeb, 120, 600);

  var sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(80, 200, 60);
  sceneTarget.add(sun);

  var ambient = new THREE.AmbientLight(0xffffff, 0.7);
  sceneTarget.add(ambient);

  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1200, 1200),
    new THREE.MeshStandardMaterial({ color: 0x9aa3ab })
  );
  ground.rotation.x = -Math.PI / 2;
  sceneTarget.add(ground);

  var roadMat = new THREE.MeshStandardMaterial({ color: 0x555b63 });
  for (var i = -400; i <= 400; i += 120) {
    var roadA = new THREE.Mesh(new THREE.PlaneGeometry(16, 1200), roadMat);
    roadA.rotation.x = -Math.PI / 2;
    roadA.position.set(i, 0.02, 0);
    sceneTarget.add(roadA);

    var roadB = new THREE.Mesh(new THREE.PlaneGeometry(1200, 16), roadMat);
    roadB.rotation.x = -Math.PI / 2;
    roadB.position.set(0, 0.02, i);
    sceneTarget.add(roadB);
  }

  var boxGeo = new THREE.BoxGeometry(1, 1, 1);
  fixedBuildingsData.forEach(b => {
    var mat = new THREE.MeshStandardMaterial({ color: b.color });
    var building = new THREE.Mesh(boxGeo, mat);
    building.scale.set(30, b.h, 30);
    building.position.set(b.x, b.h / 2, b.z);
    sceneTarget.add(building);
  });
}

function initPCStreamScene() {
  const container = document.getElementById('pc-view-container');
  container.innerHTML = '';
  pcScene = new THREE.Scene();
  if (currentActiveGame === 'trials') {
    initTrialsEnvironment(pcScene);
  } else {
    buildCityEnvironment(pcScene);
  }

  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;

  pcCamera = new THREE.PerspectiveCamera(75, w / h, 0.1, 2000);
  pcRenderer = new THREE.WebGLRenderer({ antialias: true });
  pcRenderer.setSize(w, h);
  pcRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(pcRenderer.domElement);
}

let gamepadMoveSpeed = 14;

function updateGamepadMovement() {
  if (!pcStreamActive || !sessionRef) return;
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let stickX = 0, stickY = 0;
  for (let i = 0; i < pads.length; i++) {
    const pad = pads[i];
    if (pad && pad.connected) {
      // Left stick: axes 0 (X) and 1 (Y)
      stickX = pad.axes[0] || 0;
      stickY = pad.axes[1] || 0;
      // Cross-key fallback if stick is dead
      if (Math.abs(stickX) < 0.15 && Math.abs(stickY) < 0.15) {
        const up = pad.buttons[12] ? (pad.buttons[12].pressed ? 1 : 0) : 0;
        const down = pad.buttons[13] ? (pad.buttons[13].pressed ? -1 : 0) : 0;
        const left = pad.buttons[14] ? (pad.buttons[14].pressed ? -1 : 0) : 0;
        const right = pad.buttons[15] ? (pad.buttons[15].pressed ? 1 : 0) : 0;
        stickY = up + down;
        stickX = right + left;
      }
      break;
    }
  }
  if (Math.abs(stickX) < 0.15 && Math.abs(stickY) < 0.15) return;

  var forward = new THREE.Vector3(0, 0, -1).applyQuaternion(currentQuaternion);
  var right = new THREE.Vector3(1, 0, 0).applyQuaternion(currentQuaternion);
  forward.y = 0; forward.normalize();
  right.y = 0; right.normalize();
  var move = new THREE.Vector3();
  move.addScaledVector(forward, -stickY);
  move.addScaledVector(right, stickX);
  move.normalize().multiplyScalar(gamepadMoveSpeed * 0.016);

  // Maze wall collision (only in trials)
  if (currentActiveGame === 'trials' && mazeWalls.length) {
    var tryX = playerPos.x + move.x;
    var tryZ = playerPos.z + move.z;
    if (canMoveTo(tryX, playerPos.z)) playerPos.x = tryX;
    if (canMoveTo(playerPos.x, tryZ)) playerPos.z = tryZ;
  } else {
    playerPos.add(move);
  }

  // Trials progression checks
  checkTrialsProgress();

  // Echo suppression: don't read back / fight over our own position
  if (!posSameAsWritten(playerPos.x, playerPos.y, playerPos.z, 0.001)) {
    lastWrittenPos = { x: playerPos.x, y: playerPos.y, z: playerPos.z };
    sessionRef.update({ pos: { x: playerPos.x, y: playerPos.y, z: playerPos.z } });
  }
}

function animatePC() {
  if (role !== 'pc') return;
  requestAnimationFrame(animatePC);

  if (!pcRenderer || !pcCamera) return;

  updateGamepadMovement();

  if (pcStreamActive) {
    currentQuaternion.slerp(targetQuaternion, 0.25);
    pcCamera.position.copy(playerPos);
    pcCamera.quaternion.copy(currentQuaternion);
  } else {
    var t = Date.now() * 0.0001;
    pcCamera.position.set(Math.cos(t) * 180, 130, Math.sin(t) * 180);
    pcCamera.lookAt(0, 30, 0);
  }

  pcRenderer.render(pcScene, pcCamera);
}

function startVRGameEngine() {
  document.getElementById('ui-layer').style.display = 'none';
  document.getElementById('vr-container').style.display = 'block';
  isPlaying = true;

  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(resp => {
      if (resp === 'granted') window.addEventListener('deviceorientation', handleOrientation, true);
  window.addEventListener('gamepadconnected', (e) => { console.log('Gamepad connected:', e.gamepad.id); });
  window.addEventListener('gamepaddisconnected', (e) => { console.log('Gamepad disconnected:', e.gamepad.id); });
    }).catch(console.error);
  } else {
    window.addEventListener('deviceorientation', handleOrientation, true);
  }

  initVR3D();
  animateVR();
}

function stopVRGameEngine() {
  isPlaying = false;
  document.getElementById('vr-container').style.display = 'none';
  document.getElementById('ui-layer').style.display = 'flex';
  document.getElementById('step-role').style.display = 'none';
  document.getElementById('step-phone-wait').style.display = 'block';
  document.getElementById('step-phone-wait').innerHTML = '<h1>Ожидание игры</h1><p>Игра завершена на ПК. Выберите другую игру.</p>';
}

function initVR3D() {
  scene = new THREE.Scene();
  if (currentActiveGame === 'trials') {
    initTrialsEnvironment(scene);
  } else {
    buildCityEnvironment(scene);
  }

  var leftView = document.getElementById('left-view');
  var rightView = document.getElementById('right-view');
  leftView.innerHTML = '';
  rightView.innerHTML = '';

  var aspect = (window.innerWidth / 2) / window.innerHeight;
  cameraL = new THREE.PerspectiveCamera(75, aspect, 0.1, 2000);
  cameraR = new THREE.PerspectiveCamera(75, aspect, 0.1, 2000);

  rendererL = new THREE.WebGLRenderer({ antialias: true });
  rendererL.setSize(leftView.clientWidth, leftView.clientHeight);
  rendererL.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  leftView.appendChild(rendererL.domElement);

  rendererR = new THREE.WebGLRenderer({ antialias: true });
  rendererR.setSize(rightView.clientWidth, rightView.clientHeight);
  rendererR.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  rightView.appendChild(rendererR.domElement);

  window.addEventListener('resize', onWindowResize);
}

function onWindowResize() {
  if (role === 'phone') {
    if (!isPlaying) return;
    var leftView = document.getElementById('left-view');
    var rightView = document.getElementById('right-view');
    var w = leftView.clientWidth;
    var h = leftView.clientHeight;
    rendererL.setSize(w, h);
    rendererR.setSize(w, h);
    cameraL.aspect = w / h;
    cameraL.updateProjectionMatrix();
    cameraR.aspect = w / h;
    cameraR.updateProjectionMatrix();
  } else if (role === 'pc') {
    const container = document.getElementById('pc-view-container');
    if (container && pcRenderer && pcCamera) {
      pcRenderer.setSize(container.clientWidth, container.clientHeight);
      pcCamera.aspect = container.clientWidth / container.clientHeight;
      pcCamera.updateProjectionMatrix();
    }
  }
}

function getGamepadMove() {
  var pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (var i = 0; i < pads.length; i++) {
    var gp = pads[i];
    if (gp && gp.connected) {
      var ax = gp.axes[0] || 0;
      var ay = gp.axes[1] || 0;
      if (Math.abs(ax) < 0.15) ax = 0;
      if (Math.abs(ay) < 0.15) ay = 0;
      return { x: ax, y: ay };
    }
  }
  return { x: 0, y: 0 };
}

function animateVR() {
  if (!isPlaying || role !== 'phone') return;
  requestAnimationFrame(animateVR);

  currentQuaternion.slerp(targetQuaternion, 0.25);

  // Phone also supports a connected gamepad: left stick moves the player
  var joy = getGamepadMove();
  if (joy.x !== 0 || joy.y !== 0) {
    var forward = new THREE.Vector3(0, 0, -1).applyQuaternion(currentQuaternion);
    var right = new THREE.Vector3(1, 0, 0).applyQuaternion(currentQuaternion);
    forward.y = 0; forward.normalize();
    right.y = 0; right.normalize();
    var move = new THREE.Vector3();
    move.addScaledVector(forward, -joy.y);
    move.addScaledVector(right, joy.x);
    move.normalize().multiplyScalar(14 * 0.016);
    if (currentActiveGame === 'trials' && mazeWalls.length) {
      var tryXp = playerPos.x + move.x;
      var tryZp = playerPos.z + move.z;
      if (canMoveTo(tryXp, playerPos.z)) playerPos.x = tryXp;
      if (canMoveTo(playerPos.x, tryZp)) playerPos.z = tryZp;
      checkTrialsProgress();
    } else {
      playerPos.add(move);
    }
    if (sessionRef && isPlaying && !posSameAsWritten(playerPos.x, playerPos.y, playerPos.z, 0.001)) {
      lastWrittenPos = { x: playerPos.x, y: playerPos.y, z: playerPos.z };
      sessionRef.update({ pos: { x: playerPos.x, y: playerPos.y, z: playerPos.z } });
    }
  }

  var ipd = 0.032;
  var offL = new THREE.Vector3(-ipd, 0, 0).applyQuaternion(currentQuaternion);
  var offR = new THREE.Vector3(ipd, 0, 0).applyQuaternion(currentQuaternion);

  cameraL.position.copy(playerPos).add(offL);
  cameraL.quaternion.copy(currentQuaternion);

  cameraR.position.copy(playerPos).add(offR);
  cameraR.quaternion.copy(currentQuaternion);

  rendererL.render(scene, cameraL);
  rendererR.render(scene, cameraR);
}
</script>
